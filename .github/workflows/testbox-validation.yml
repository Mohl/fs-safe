name: Native parent traversal qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Paired native parent traversal (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows-latest' && 'fs-safe-windows-16core' || matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: carrier
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 305ff575ce134bb596c0eb4bc9205fac8575a884
          path: A
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0aa0fa5ee942d117abfda15b1b93aa6cf732310e
          path: B
          persist-credentials: false

      - name: Verify Windows runner
        if: matrix.os == 'windows-latest'
        uses: ./carrier/.github/actions/verify-windows-ci-runner

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up portable archive LLVM
        uses: ./carrier/.github/actions/setup-archive-llvm

      - name: Prepare independent build roots
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          packet = pathlib.Path('carrier/scripts/native-policy-parent-proof')
          pins = json.loads((packet / 'pins.json').read_text())
          assert pins['ready'] is True
          manifest = json.loads((packet / 'packet-manifest.json').read_text())
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((packet / name).read_bytes()).hexdigest() == digest, name
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('fs-safe-parent-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          work.mkdir()
          (work / 'evidence').mkdir()
          tools = {'python': {'version': sys.version, 'path': sys.executable}}
          for tool in ('node', 'pnpm', 'cargo', 'rustc'):
              resolved = shutil.which(tool)
              assert resolved, tool
              tools[tool] = {'path': resolved, 'sha256': hashlib.sha256(pathlib.Path(resolved).read_bytes()).hexdigest()}
          for key in ('CC_wasm32_unknown_unknown', 'AR_wasm32_unknown_unknown'):
              resolved = os.environ[key]
              tools[key] = {'path': resolved, 'sha256': hashlib.sha256(pathlib.Path(resolved).read_bytes()).hexdigest()}
          (work / 'evidence/tools.json').write_text(json.dumps(tools, indent=2) + '\n')
          for role in ('A', 'B'):
              for expr, expected in (('HEAD', pins[role]['commit']), ('HEAD^{tree}', pins[role]['tree'])):
                  actual = subprocess.check_output(['git', '-C', role, 'rev-parse', expr], text=True).strip()
                  assert actual == expected
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PAIR_WORK=' + str(work) + '\n')
          PY

      - name: Build baseline
        working-directory: A
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm native:build

      - name: Build candidate
        working-directory: B
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

      - name: Share verified unchanged native binary
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python carrier/scripts/native-policy-parent-proof/share-native.py "$GITHUB_WORKSPACE" "$PAIR_WORK"
          cd B
          node scripts/stage-host-native.mjs

      - name: Run common safety cases on both arms
        timeout-minutes: 15
        env:
          FS_SAFE_NATIVE_MODE: require
          FS_SAFE_TEST_SERIAL: '1'
        run: |
          set -euo pipefail
          for arm in A B; do
            (
              cd "$arm"
              pnpm test test/native-windows-policy-parent.test.ts test/pinned-mutation-fast-path.test.ts test/pinned-mutation-receipt-walk.test.ts test/native-mutation-policy-admission.test.ts test/native-policy-directory-observation.test.ts test/native-parent-admission-close.test.ts test/native-parent-native-observation.test.ts test/root-native-windows-policy.test.ts test/root-copy-windows-publication.test.ts test/native-pinned-write-falsy-close.test.ts test/staged-file-failures.test.ts test/pinned-mutation-shared-eligibility.test.ts test/windows-native-fd-bridge.test.ts --maxWorkers=1 --retry=0 --reporter=json --outputFile "$PAIR_WORK/evidence/source-$arm.json"
            )
          done
          cd B
          pnpm test test/native-policy-parent-owner.test.ts --maxWorkers=1 --retry=0 --reporter=json --outputFile "$PAIR_WORK/evidence/source-owner-B.json"
          cd ..
          python carrier/scripts/native-policy-parent-proof/check-source-tests.py "$PAIR_WORK"

      - name: Check installed baseline package
        working-directory: A
        timeout-minutes: 20
        env:
          FS_SAFE_EXPECTED_SOURCE_COMMIT: 305ff575ce134bb596c0eb4bc9205fac8575a884
        run: pnpm package:smoke --output "$PAIR_WORK/packages-A"

      - name: Check installed candidate package
        working-directory: B
        timeout-minutes: 20
        env:
          FS_SAFE_EXPECTED_SOURCE_COMMIT: 0aa0fa5ee942d117abfda15b1b93aa6cf732310e
        run: pnpm package:smoke --output "$PAIR_WORK/packages-B"

      - name: Install and bind independent consumers
        timeout-minutes: 10
        run: node carrier/scripts/native-policy-parent-proof/prepare-consumers.mjs "$GITHUB_WORKSPACE" "$PAIR_WORK"

      - name: Qualify public behavior and run frozen paired study
        timeout-minutes: 120
        run: python carrier/scripts/native-policy-parent-proof/run-study.py "$GITHUB_WORKSPACE" "$PAIR_WORK"

      - name: Collect settled evidence
        id: collect
        if: always() && env.PAIR_WORK != ''
        timeout-minutes: 5
        run: python carrier/scripts/native-policy-parent-proof/collect.py "$PAIR_WORK"

      - name: Upload settled evidence
        if: always() && steps.collect.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-parent-proof-${{ matrix.os }}
          path: |
            ${{ env.PAIR_WORK }}/parent-proof.tar.gz
            ${{ env.PAIR_WORK }}/archive.json
          if-no-files-found: error
          retention-days: 14
