name: Clone filesystem qualification

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Qualification run identifier (retained dispatch interface)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Clone filesystem qualification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up portable archive LLVM
        uses: ./.github/actions/setup-archive-llvm

      - name: Run the frozen qualification packet
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          packet="$(mktemp -d /tmp/fs-safe-clone-packet-XXXXXX)"
          work="$(mktemp -d /tmp/fs-safe-clone-admission-XXXXXX)"
          transport="$RUNNER_TEMP/fs-safe-clone-source"
          cp -R scripts/clone-filesystem-proof/. "$packet/"
          git worktree add --detach "$transport" 1538b2dd47644a592542d5f4ac025614ba8a1ec1
          python3 - "$packet" <<'PY'
          import hashlib, json, pathlib, sys
          packet = pathlib.Path(sys.argv[1])
          manifest = packet / "packet-manifest.json"
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == "a89593af02735258d7fb61277e3fc42844aee2fcc1640d32f4ed0edc2d66dffc"
          pins_path = packet / "pins.json"
          pins = json.loads(pins_path.read_text())
          assert pins["ready"] is False
          pins["ready"] = True
          pins_path.write_text(json.dumps(pins, indent=2) + "\n")
          PY
          echo "PROOF_WORK=$work" >> "$GITHUB_ENV"
          set +e
          python3 "$packet/harness/clone-supervise.py" "$work" "$transport"
          proof_exit=$?
          set -e
          python3 scripts/clone-filesystem-proof/publish-evidence.py "$work"
          exit "$proof_exit"

      - name: Upload settled proof evidence
        if: ${{ always() && env.PROOF_ARCHIVE != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clone-filesystem-proof
          path: ${{ env.PROOF_ARCHIVE }}
          if-no-files-found: warn
          retention-days: 14
