name: Isolated macOS pre-observation qualification

on:
  workflow_dispatch:
    inputs:
      expected_harness_sha:
        description: Exact independently reviewed carrier commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preobservation-isolated-macos
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      EXPECTED_HARNESS_SHA: ${{ inputs.expected_harness_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EVIDENCE_ROOT: ${{ github.workspace }}/preobservation-evidence
    steps:
      - name: Check out reviewed carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Check carrier and environment before setup
        run: |
          python3 -I "$GITHUB_WORKSPACE/harness/scripts/qualification/preobservation/prepare.py" admit
      - name: Check out exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e85a5ec94704eed140d68affa72ec12174ca788c
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 66b80a1e94eedc3ef822590e67f2227fd8d1faf1
          path: candidate
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview --target wasm32-unknown-unknown 2>&1 | tee "$EVIDENCE_ROOT/toolchain-install.log"
      - name: Set up portable archive compiler
        run: |
          node "$GITHUB_WORKSPACE/harness/.github/actions/setup-archive-llvm/install.mjs" 2>&1 | tee "$EVIDENCE_ROOT/archive-compiler-install.log"
      - name: Build and qualify both installations
        timeout-minutes: 45
        run: |
          python3 -I "$GITHUB_WORKSPACE/harness/scripts/qualification/preobservation/prepare.py" build
      - name: Run one diagnostic and conditional frozen campaign
        timeout-minutes: 60
        run: |
          python3 -I "$GITHUB_WORKSPACE/harness/scripts/qualification/preobservation/experiment.py" "$EVIDENCE_ROOT"
      - name: Hash all retained evidence
        if: always()
        run: |
          python3 -I "$GITHUB_WORKSPACE/harness/scripts/qualification/preobservation/prepare.py" collect
      - name: Upload complete evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preobservation-isolated-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
