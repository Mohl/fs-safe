name: Larger macOS VM pre-observation suitability

on:
  workflow_dispatch:
    inputs:
      expected_harness_sha:
        description: Exact independently reviewed carrier commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preobservation-larger-macos
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      EXPECTED_HARNESS_SHA: ${{ inputs.expected_harness_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FS_SAFE_PROOF_ROOT: ${{ github.workspace }}/fs-safe-preobservation.noindex
      EVIDENCE_ROOT: ${{ github.workspace }}/fs-safe-preobservation.noindex/evidence
      TMPDIR: ${{ github.workspace }}/fs-safe-preobservation.noindex/tmp
      CARGO_HOME: ${{ github.workspace }}/fs-safe-preobservation.noindex/tooling/cargo
      RUSTUP_HOME: ${{ github.workspace }}/fs-safe-preobservation.noindex/tooling/rustup
      PNPM_HOME: ${{ github.workspace }}/fs-safe-preobservation.noindex/tooling/pnpm
      npm_config_cache: ${{ github.workspace }}/fs-safe-preobservation.noindex/caches/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/fs-safe-preobservation.noindex/caches
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/fs-safe-preobservation.noindex/caches/clang
    steps:
      - name: Establish private paths and task-work deadline
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib, time
          root = pathlib.Path(os.environ['FS_SAFE_PROOF_ROOT'])
          root.mkdir()
          (root / 'tmp').mkdir()
          with (root / 'lifecycle.json').open('x') as stream:
              json.dump(dict(startedMonotonic=time.monotonic(), taskWorkSeconds=6600, originalHome=os.environ.get('HOME')), stream)
          PY
      - name: Check out reviewed carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: fs-safe-preobservation.noindex/harness
          persist-credentials: false
      - name: Check carrier and environment before setup
        run: |
          python3 -I "$FS_SAFE_PROOF_ROOT/harness/scripts/qualification/preobservation/prepare.py" admit
      - name: Check out exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9543f52cc075385e149c130c32927a25e77dc4f6
          path: fs-safe-preobservation.noindex/baseline
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d27b43ac9373869af42548b6f296d9bd9b130936
          path: fs-safe-preobservation.noindex/candidate
          persist-credentials: false
      - name: Install pinned tools beneath the private root
        run: |
          python3 -I "$FS_SAFE_PROOF_ROOT/harness/scripts/qualification/preobservation/bootstrap.py"
      - name: Build and qualify both installations
        timeout-minutes: 45
        run: |
          python3 -I "$FS_SAFE_PROOF_ROOT/harness/scripts/qualification/preobservation/prepare.py" build
      - name: Run one diagnostic and conditional frozen campaign
        timeout-minutes: 60
        run: |
          python3 -I "$FS_SAFE_PROOF_ROOT/harness/scripts/qualification/preobservation/experiment.py" "$EVIDENCE_ROOT"
      - name: Hash all retained evidence
        if: always()
        run: |
          python3 -I "$FS_SAFE_PROOF_ROOT/harness/scripts/qualification/preobservation/prepare.py" collect
      - name: Upload complete evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preobservation-larger-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
